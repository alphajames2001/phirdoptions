<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <title>Phird Options Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #0d0d0d;
            border: 1px solid #2b2b2b;
            border-radius: 0;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            font-size: 28px;
            font-weight: 600;
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: -0.01em;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .login-container .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: 1px solid #2b2b2b;
            border-radius: 0;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ffffff;
        }
        .form-group input::placeholder {
            color: #555;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 0;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: filter 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn:hover {
            filter: invert(1);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        .success {
            color: #00c853;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #aaa;
        }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #0d0d0d;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 0;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }
        .toast.error {
            background: #ef4444;
            color: #fff;
        }
        .toast.success {
            background: #ffffff;
            color: #000000;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>⚡ Admin</h1>
        <div class="subtitle">Sign in to manage the platform</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="admin@example.com" 
                    required 
                    autocomplete="email"
                />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password"
                />
            </div>
            <button type="submit" class="btn" id="loginBtn">Sign In</button>
            <div id="message"></div>
        </form>
        
        <a href="/" class="back-link">← Back to Phird Options</a>
    </div>

    <div class="toast-container" id="toasts"></div>

    <script>
        const API_URL = window.location.origin;
        const FRONTEND_URL = 'https://gtest-1-sj6i.onrender.com';

        function toast(message, type = 'error') {
            const container = document.getElementById('toasts');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('message');
            
            if (!email || !password) {
                msg.innerHTML = '<div class="error">Please enter email and password</div>';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> Signing in...';
            msg.innerHTML = '';
            
            try {
                console.log('[Admin Login] Attempting login for:', email);
                
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                console.log('[Admin Login] Response:', data);
                
                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }
                
                if (data.success) {
                    // Store token
                    sessionStorage.setItem('gwave_admin_token', data.data.token);
                    sessionStorage.setItem('gwave_admin_user', JSON.stringify(data.data.user));

                    // This form is shared by admins and influencers (see
                    // server.js /admin/login) — route each to their own page.
                    const role = data.data.user.role;
                    const destination = role === 'influencer' ? '/admin/influencer.html' : '/admin/dashboard.html';

                    toast(role === 'influencer' ? 'Welcome!' : 'Welcome admin!', 'success');
                    msg.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
                    
                    // ✅ FIX: Redirect with token in URL as fallback
                    setTimeout(() => {
                        window.location.href = `${destination}?token=${data.data.token}`;
                    }, 500);
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            } catch (err) {
                console.error('[Admin Login] Error:', err);
                msg.innerHTML = `<div class="error">${err.message}</div>`;
                toast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        // Check if already logged in. The stored user's role decides which
        // endpoint proves the token is still valid and where to send them —
        // /admin/stats is admin-only and would 403 an influencer's token
        // every time, wrongly logging them out.
        const token = sessionStorage.getItem('gwave_admin_token');
        const storedUser = JSON.parse(sessionStorage.getItem('gwave_admin_user') || 'null');
        if (token && storedUser) {
            const isInfluencer = storedUser.role === 'influencer';
            const checkUrl = isInfluencer ? '/influencer/balance' : '/admin/stats';
            const destination = isInfluencer ? '/admin/influencer.html' : '/admin/dashboard.html';

            fetch(`${API_URL}${checkUrl}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if (res.ok) {
                    window.location.href = destination;
                } else {
                    sessionStorage.removeItem('gwave_admin_token');
                    sessionStorage.removeItem('gwave_admin_user');
                }
            })
            .catch(() => {
                sessionStorage.removeItem('gwave_admin_token');
                sessionStorage.removeItem('gwave_admin_user');
            });
        }
    </script>
</body>
</html>
